
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Decrypt Image - Steganography</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #1d2671, #c33764);
            color: #fff;
            min-height: 100vh;
            padding-bottom: 60px;
        }
        .form-container {
            background: #fff;
            color: #333;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            margin-top: 50px;
        }
        .btn-gradient {
            background: linear-gradient(to right, #c33764, #1d2671);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 10px 25px;
        }
        .btn-gradient:hover {
            background: linear-gradient(to right, #302b63, #0f0c29);
        }
    </style>
</head>
<body>

    {% include 'navbar.html' %}

    <div class="container">
        <div class="form-container mx-auto col-md-8 col-lg-6">
            <h2 class="text-center mb-4">🕵️‍♂️ Decrypt Hidden Message</h2>
            <form action="{% url 'decryption' %}" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="image" class="form-label">Upload Encrypted Image:</label>
                    <input type="file" name="image" id="image" class="form-control" required>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-gradient">Decrypt</button>
                </div>
            </form>

            {% if text %}
                <div class="alert alert-success mt-4">
                    <h5 class="text-success">✅ Decrypted Message:</h5>
                    <p class="mb-0">{{ text }}</p>
                </div>
            {% endif %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
